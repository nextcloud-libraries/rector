version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    commit-message:
      prefix: "build"
      include: "scope"
    versioning-strategy: "increase"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
